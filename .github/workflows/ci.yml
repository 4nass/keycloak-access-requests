name: Build and tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'themes/access-requests-ui/**'
      - '.github/workflows/**'
      - '*.xml'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Keycloak ${{ matrix.keycloak }} build and test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['26.7.0', '26.7.1', '26.7.2', '26.7.3', '26.7.4', '26.7.5', '26.8.0', '26.8.1']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, unit test and integration test
        run: mvn --batch-mode --no-transfer-progress clean verify -Dkeycloak.test.version=${{ matrix.keycloak }}

      - name: Upload provider JAR and e-mail theme bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keycloak-access-requests-${{ matrix.keycloak }}
          path: |
            target/keycloak-access-requests.jar
            target/*-email-theme.zip
          if-no-files-found: error
