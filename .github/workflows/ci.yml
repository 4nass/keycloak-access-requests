name: Build and tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'themes/access-requests-ui/**'
      - '.github/workflows/**'
      - '*.xml'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Keycloak ${{ matrix.keycloak }} build and test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['26.7.0', '26.7.1', '26.7.2', '26.7.3', '26.7.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, unit test and integration test
        run: mvn --batch-mode --no-transfer-progress clean verify -Dkeycloak.test.version=${{ matrix.keycloak }}

      - name: Upload provider JAR and e-mail theme bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keycloak-access-requests-${{ matrix.keycloak }}
          path: |
            target/keycloak-access-requests.jar
            target/*-email-theme.zip
          if-no-files-found: error
