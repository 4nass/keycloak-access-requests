name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check tag and project versions match
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(awk -F'[<>]' '/<version>/{print $3; exit}' pom.xml)"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match Maven project version $project_version." >&2
            exit 1
          fi

      - name: Build and test release artifacts
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

      - name: Upload provider and e-mail theme assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" target/keycloak-access-requests.jar target/*-email-theme.zip --clobber
